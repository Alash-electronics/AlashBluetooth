sentence=Easy Bluetooth module setup for HC-05, HC-06 and HM-10: auto-detect the module and baud rate, set name, PIN and speed, read phone commands.
paragraph=Configures HC-05, HC-06 and HM-10 Bluetooth modules without memorizing AT commands: detect() finds the module type and the baud rate by itself, setName(), setPin() and setBaudRate() use the right command for each module with sensible value checks, and readLine()/parseCommand() receive text commands such as speed=80 from a phone app without blocking. Explains why a silent module is silent (wiring, AT mode, connected phone) in Russian, Kazakh or English. Works on Arduino AVR, ESP32 and ESP8266 with any Stream. Examples included, made for classes and kits by Alash Electronics.
